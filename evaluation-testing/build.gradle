description = 'evaluation-testing'

dependencies {
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'
    // new test dep
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


}
tasks.named('test') {
    useJUnitPlatform()
    if (project.hasProperty('geminiApiKey')) {
        environment 'GEMINI_API_KEY', project.property('geminiApiKey')
    }

    if (project.hasProperty('finnhubApiKey')) {
        environment 'FINNHUB_API_KEY', project.property('finnhubApiKey')
    }
}

