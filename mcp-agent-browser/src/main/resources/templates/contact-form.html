<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Local Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .form-container { max-width: 500px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Customer Feedback & Inquiry</h2>
    <form th:action="@{/contact}" th:object="${contactForm}" method="post">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}" required placeholder="Jane Doe"/>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" required placeholder="jane@example.com"/>
        </div>

        <div class="form-group">
            <label for="topic">Inquiry Topic</label>
            <select id="topic" th:field="*{topic}">
                <option value="General Support">General Support</option>
                <option value="Sales & Pricing">Sales & Pricing</option>
                <option value="Course Feedback">Course Feedback</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" th:field="*{message}" rows="4" placeholder="Write your notes here..."></textarea>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="subscribeNewsletter" th:field="*{subscribeNewsletter}"/>
                Subscribe to monthly updates
            </label>
        </div>

        <button type="submit" id="submitBtn">Submit Inquiry</button>
    </form>
</div>

</body>
</html>
